name: Build and Release SystemReport

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*' # Triggers the release block when you push a tag like v1.1.0
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # Crucial: Allows GitHub Actions to create a release and upload assets

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run Build Batch Script
      shell: cmd
      run: |
        call Build.bat -q

    # Step A: Always upload the artifact to the Actions tab for quick access
    - name: Upload Artifact to Actions
      uses: actions/upload-artifact@v4
      with:
        name: SystemReport-Binary
        path: SystemReport.exe

    # Step B: Only creates a GitHub Release when a tag (e.g., v1.0.0) is pushed
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        files: SystemReport.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
